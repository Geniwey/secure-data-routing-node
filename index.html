<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="referrer" content="no-referrer-when-downgrade" />
    
    <meta name="hilltopads-site-verification" content="ca20ae5a3d6f87fa5faf" />

    <title>System Node | Secure Data Transfer</title>
    <style>
        body { 
            background: #000; 
            color: #00ff00; 
            font-family: 'Courier New', monospace; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center;
            overflow: hidden; 
        }
        .console-box { 
            border: 1px solid #222; 
            padding: 40px; 
            box-shadow: 0 0 20px rgba(0,255,0,0.1); 
            width: 90%; 
            max-width: 600px; 
        }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        
        /* Contenedor central para que el Banner de HilltopAds se vea bien */
        #ad-container { 
            margin-top: 30px; 
            min-height: 250px; 
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="console-box">
        <p>> INITIALIZING SECURE PROTOCOL...</p>
        <p>> ENCRYPTING TUNNEL <span class="blink">_</span></p>
        <p id="status">> NODE VERIFIED. ESTABLISHING CONNECTION...</p>
        
        <div id="ad-container">
            </div>
    </div>

    <script>
        // Animación de la consola para que la página parezca viva y retenga al bot
        // El bot de FeelingSurf estará aquí entre 35 y 65 segundos facturando.
        setInterval(function() {
            var el = document.getElementById('status');
            if (el.innerHTML.includes("...")) {
                el.innerHTML = "> MAINTAINING SECURE LAYER ACTIVE.";
            } else if (el.innerHTML.includes("..")) {
                el.innerHTML = "> MAINTAINING SECURE LAYER ACTIVE...";
            } else {
                el.innerHTML += ".";
            }
        }, 1500);
    </script>
</body>
</html>
