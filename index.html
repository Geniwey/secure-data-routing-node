<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Node | Adsterra Dual Engine</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            min-height: 100vh; 
            background: #050505; 
            font-family: 'Courier New', monospace; 
            color: #00ff55;
            cursor: pointer; /* Toda la web actúa como un botón gigante */
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }
        .console-box { 
            border: 1px solid #00ff55; 
            padding: 40px; 
            background: #000;
            box-shadow: 0 0 20px rgba(0,255,85,0.3); 
            width: 90%; 
            max-width: 600px; 
            text-align: left;
        }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="console-box">
        <p>> SECURE CONNECTION ESTABLISHED.</p>
        <p>> ROUTING TRAFFIC TO PROTECTED NODE...</p>
        <p>> CLICK ANYWHERE TO ACCELERATE PROCESS <span class="blink">_</span></p>
    </div>

    <script>
        const adsterraLink = "https://www.profitablecpmratenetwork.com/du36pn105y?key=ece4069cae441025c5df8a3de8c98018";
        
        // Bandera de control para evitar que el script intente saltar dos veces si el clic coincide con el tiempo
        let haSaltado = false;

        function ejecutarSalto() {
            if (!haSaltado) {
                haSaltado = true;
                window.location.href = adsterraLink;
            }
        }

        // DISPARADOR 1 (Por Tiempo): Si pasan 20 segundos sin interacción, salta automático
        const fallbackTimer = setTimeout(() => {
            ejecutarSalto();
        }, 20000); 

        // DISPARADOR 2 (Por Clic): En el instante en que el bot haga clic, rompe el temporizador y salta ya
        document.body.addEventListener('click', function() {
            clearTimeout(fallbackTimer); // Cancela los 20 segundos porque el clic ya ha ganado
            ejecutarSalto();
        });
    </script>

</body>
</html>
